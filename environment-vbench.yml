# Supported target: Linux x86_64 with NVIDIA GPUs.
name: virdm-vbench
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.10
  - pip
  - nvidia::cuda-toolkit=12.1
  - gxx_linux-64=12
  - make
  - git
  - pkg-config
# Install PyTorch before native extensions using the setup script.
